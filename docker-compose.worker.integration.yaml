name: worker-integration-tests

services:
  worker-integration-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: worker_integration_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-test-password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d worker_integration_test_db",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  worker-integration-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  worker-integration-tests:
    build:
      context: .
      dockerfile: worker_service/Dockerfile.integration
    environment:
      POSTGRES_HOST: worker-integration-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: worker_integration_test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-test-password
      POSTGRES_ECHO: "false"
      REDIS_HOST: worker-integration-redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      DEBUG: "false"
    depends_on:
      worker-integration-postgres:
        condition: service_healthy
      worker-integration-redis:
        condition: service_healthy
